<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otoiro demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"><img id="backdrop-img" alt="" /></div>
    <main class="card" id="drop-zone">
      <section class="now">
        <div class="art">
          <img id="cover" alt="" hidden />
          <canvas id="art-canvas" width="264" height="264"></canvas>
        </div>
        <div class="meta">
          <div class="eyebrow" id="eyebrow">NOW PLAYING</div>
          <h1 class="title" id="title">ファイルをドロップ</h1>
          <div class="artist" id="artist">または「開く」で音声ファイルを選択</div>
          <div class="chips" id="chips"></div>
        </div>
        <button class="open" id="open">開く</button>
      </section>
      <section class="deck">
        <div class="deck-main">
          <oto-seekbar id="seekbar"></oto-seekbar>
          <div class="nav">
            <button id="prev-section" title="前のセクション (PageUp)">⏮ セクション</button>
            <button id="vocals" title="歌いだし（推定）へ">♪ 歌いだし</button>
            <button id="highlight" class="star" title="次のサビ候補へ（推定）">★ サビ候補へ</button>
            <button id="next-section" title="次のセクション (PageDown)">セクション ⏭</button>
          </div>
          <oto-transport id="transport"></oto-transport>
        </div>
        <oto-jog id="jog" fps="30" title="ドラッグ／ホイール: 1拍　Shift: 1小節　Ctrl: 1フレーム　下のチップで単位を切り替え"></oto-jog>
      </section>
      <p class="error" id="error" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
